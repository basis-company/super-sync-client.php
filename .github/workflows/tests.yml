name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, sodium, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit tests/WorkspaceBugTest.php

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: supersync
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, sodium, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Start sync server
        run: |
          docker run -d \
            --name sync-server \
            -p 3000:1900 \
            -e DATABASE_URL="postgresql://user:password@localhost:5432/supersync" \
            -e JWT_SECRET="85b62616ab5ce2aceac1f9191240207bab896dd8ccd84b45804a26095d19878b" \
            -e NODE_ENV=development \
            ghcr.io/johannesjo/supersync:latest

      - name: Wait for sync server
        run: |
          for i in $(seq 1 60); do
            if curl -f http://localhost:3000/ >/dev/null 2>&1; then
              echo "Sync server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Sync server did not start in time"
          exit 1

      - name: Run integration tests
        run: vendor/bin/phpunit tests/IntegrationTest.php

      - name: Cleanup sync server
        if: always()
        run: docker rm -f sync-server
