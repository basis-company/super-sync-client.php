name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, sodium, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit tests/WorkspaceBugTest.php

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, sodium, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Start sync server
        run: docker compose up -d

      - name: Create test user
        run: |
          docker compose exec -T postgres psql -U user -d supersync -c \
            "INSERT INTO users (id, email, password, created, updated) VALUES (1, 'test@example.com', '\$2y\$10\$dummyhashforthetest', NOW(), NOW()) ON CONFLICT DO NOTHING;"

      - name: Wait for sync server
        run: |
          for i in $(seq 1 60); do
            if curl -f http://localhost:3000/ >/dev/null 2>&1; then
              echo "Sync server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Sync server did not start in time"
          exit 1

      - name: Run integration tests
        run: vendor/bin/phpunit tests/IntegrationTest.php

      - name: Cleanup sync server
        if: always()
        run: docker compose down
